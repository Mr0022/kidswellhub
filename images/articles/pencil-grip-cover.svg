    <path d="M84-25L176-25L182 0L176 25L84 25L78 0Z" fill="#3f6cff"/>
    <path d="M96-25v50M112-25v50M128-25v50M144-25v50M160-25v50" stroke="#2c4fd8" stroke-width="4"/>
