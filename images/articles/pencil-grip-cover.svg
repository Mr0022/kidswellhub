    <rect x="980" y="140" width="56" height="58" rx="14" fill="#7c5cff"/>
    <rect x="1022" y="140" width="14" height="58" fill="#7c5cff"/>
  </g>

  <use href="#spark" transform="translate(190 150) scale(1.3)" fill="#3f6cff"/>
  <use href="#spark" transform="translate(960 300) scale(.8)" fill="#ffb020"/>
  <use href="#spark" transform="translate(1130 420) scale(1)" fill="#ff7ab6"/>
