<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0ff"/>
      <stop offset="1" stop-color="#fff0f8"/>
    </linearGradient>
    <circle id="dot" r="12"/>
    <circle id="empty" r="10" fill="none" stroke="#ece6f5" stroke-width="3"/>
    <path id="spark" d="M0-16C2-5 5-2 16 0C5 2 2 5 0 16C-2 5-5 2-16 0C-5-2-2-5 0-16Z"/>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="700" cy="420" r="170" fill="#ffa8d5" opacity=".2"/>
  <circle cx="90" cy="70" r="140" fill="#c9b4ff" opacity=".22"/>

  <!-- تخته‌شاسی -->
  <rect x="188" y="60" width="440" height="420" rx="26" fill="#831843" opacity=".08"/>
  <rect x="180" y="50" width="440" height="420" rx="26" fill="#c9a27a"/>
  <rect x="205" y="92" width="390" height="356" rx="12" fill="#ffffff"/>
  <rect x="336" y="32" width="128" height="50" rx="14" fill="#9aa3b8"/>
  <rect x="380" y="44" width="40" height="14" rx="7" fill="#c9a27a"/>

  <!-- جدول هفته: ستون‌ها روزها (از راست به چپ)، سطرها حیطه‌ها -->
  <g fill="#d9d3e6">
    <circle cx="514" cy="124" r="5"/><circle cx="470" cy="124" r="5"/><circle cx="426" cy="124" r="5"/>
    <circle cx="382" cy="124" r="5"/><circle cx="338" cy="124" r="5"/><circle cx="294" cy="124" r="5"/><circle cx="250" cy="124" r="5"/>
  </g>
  <path d="M228 144H576M228 216H576M228 288H576M228 360H576" stroke="#f1edf7" stroke-width="3"/>
  <path d="M536 108V430" stroke="#f1edf7" stroke-width="3"/>

  <!-- برچسب سطرها: یک رنگ برای هر حیطه -->
  <g>
    <rect x="545" y="167" width="26" height="26" rx="7" fill="#e0409b"/>
    <rect x="545" y="239" width="26" height="26" rx="7" fill="#3f6cff"/>
    <rect x="545" y="311" width="26" height="26" rx="7" fill="#ffb020"/>
    <rect x="545" y="383" width="26" height="26" rx="7" fill="#16a34a"/>
  </g>

  <!-- سطر ۱: تقریباً هر روز تکرار شده (الگو) -->
  <g fill="#e0409b">
    <use href="#dot" x="514" y="180"/><use href="#dot" x="470" y="180"/><use href="#dot" x="426" y="180"/>
    <use href="#dot" x="382" y="180"/><use href="#dot" x="294" y="180"/><use href="#dot" x="250" y="180"/>
  </g>
  <use href="#empty" x="338" y="180"/>

  <!-- سطر ۲: فقط یک بار -->
  <use href="#dot" x="426" y="252" fill="#3f6cff"/>
  <use href="#empty" x="514" y="252"/><use href="#empty" x="470" y="252"/><use href="#empty" x="382" y="252"/>
  <use href="#empty" x="338" y="252"/><use href="#empty" x="294" y="252"/><use href="#empty" x="250" y="252"/>

  <!-- سطر ۳: بیشتر روزها (الگو) -->
  <g fill="#ffb020">
    <use href="#dot" x="514" y="324"/><use href="#dot" x="470" y="324"/><use href="#dot" x="382" y="324"/>
    <use href="#dot" x="338" y="324"/><use href="#dot" x="250" y="324"/>
  </g>
  <use href="#empty" x="426" y="324"/><use href="#empty" x="294" y="324"/>

  <!-- سطر ۴: هیچ -->
  <use href="#empty" x="514" y="396"/><use href="#empty" x="470" y="396"/><use href="#empty" x="426" y="396"/>
  <use href="#empty" x="382" y="396"/><use href="#empty" x="338" y="396"/><use href="#empty" x="294" y="396"/>
  <use href="#empty" x="250" y="396"/>

  <!-- دو سطری که الگو دارند با کادر برجسته شده‌اند -->
  <rect x="226" y="158" width="304" height="44" rx="22" fill="none" stroke="#e0409b" stroke-width="4" stroke-dasharray="10 8"/>
  <rect x="226" y="302" width="304" height="44" rx="22" fill="none" stroke="#ffb020" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- مداد -->
  <g transform="translate(676 360) rotate(28)">
    <rect x="-14" y="-120" width="28" height="110" rx="5" fill="#ff7ab6"/>
    <rect x="-14" y="-134" width="28" height="18" rx="5" fill="#ffc24b"/>
    <path d="M-14-10H14L0 18Z" fill="#f3d3a6"/>
    <path d="M-5 8L0 18L5 8Z" fill="#3a3550"/>
  </g>

  <use href="#spark" transform="translate(110 300) scale(1.1)" fill="#e0409b"/>
  <use href="#spark" transform="translate(700 110) scale(.9)" fill="#7c5cff"/>
</svg>
