  <rect x="286" y="402" width="120" height="38" rx="8" fill="#ffc24b"/>
  <rect x="286" y="402" width="120" height="10" rx="5" fill="#ffd779"/>

  <!-- میز به بلندی آرنج -->
  <rect x="300" y="236" width="360" height="16" rx="6" fill="#e7b98a"/>
