  <!-- صندلی -->
  <rect x="150" y="166" width="16" height="150" rx="8" fill="#9ec2ff"/>
  <rect x="150" y="300" width="138" height="16" rx="8" fill="#9ec2ff"/>
  <rect x="156" y="316" width="12" height="124" rx="5" fill="#7aa7f5"/>
  <rect x="270" y="316" width="12" height="124" rx="5" fill="#7aa7f5"/>

