<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaec"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <!-- کاشی کوچک برنامه‌ی بیرون از خانه؛ گوشه‌ی بالا‌ـ‌چپ در (0,0)، ۸۴×۸۴ -->
    <rect id="tile" width="84" height="84" rx="16" fill="#ffffff" stroke="#efe2c8" stroke-width="3"/>
    <path id="spark" d="M0-16C2-5 5-2 16 0C5 2 2 5 0 16C-2 5-5 2-16 0C-5-2-2-5 0-16Z"/>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="100" cy="440" r="170" fill="#ffd88a" opacity=".25"/>
  <circle cx="720" cy="40" r="140" fill="#9ec2ff" opacity=".22"/>

  <!-- زمان‌سنج دیداری: بخش رنگی همان زمانی است که مانده و کم‌کم کوچک می‌شود -->
  <ellipse cx="586" cy="420" rx="140" ry="12" fill="#7c2d12" opacity=".1"/>
  <rect x="580" y="64" width="40" height="20" rx="8" fill="#e2a33a" transform="translate(-14 0)"/>
  <rect x="466" y="80" width="240" height="330" rx="34" fill="#f59e0b"/>
  <rect x="466" y="80" width="240" height="330" rx="34" fill="none" stroke="#e08a00" stroke-width="4"/>
  <circle cx="586" cy="232" r="104" fill="#ffffff"/>
  <path d="M586 232V140A92 92 0 0 0 494 232Z" fill="#e11d48"/>
  <g stroke="#3a3550" stroke-width="4" stroke-linecap="round">
    <path d="M586 132V146M686 232H672M586 332V318M486 232H500"/>
  </g>
  <g stroke="#c9c4d6" stroke-width="3" stroke-linecap="round">
    <path d="M636 145L631 154M673 182L664 187M673 282L664 277M636 319L631 310M536 319L541 310M499 282L508 277M499 182L508 187M536 145L541 154"/>
  </g>
  <circle cx="586" cy="232" r="16" fill="#3a3550"/>
  <circle cx="586" cy="232" r="6" fill="#ffffff"/>
  <rect x="512" y="358" width="148" height="22" rx="11" fill="#ffffff" opacity=".45"/>

  <!-- برنامه‌ی کوچک بیرون از خانه: ماشین، خرید، پارک، خانه (از راست به چپ) -->
  <ellipse cx="236" cy="352" rx="210" ry="12" fill="#7c2d12" opacity=".08"/>
  <rect x="20" y="180" width="432" height="128" rx="26" fill="#fff4dc" stroke="#ffd88a" stroke-width="5"/>
  <circle cx="44" cy="244" r="11" fill="#ffffff" stroke="#e4d6b8" stroke-width="5"/>

  <!-- ماشین -->
  <g transform="translate(352 202) scale(.905)">
    <use href="#tile"/>
    <path d="M18 48V40Q18 34 24 33L30 22Q32 18 38 18H52Q57 18 60 22L66 33Q70 34 70 40V48Q70 52 66 52H22Q18 52 18 48Z" fill="#3f6cff"/>
    <path d="M33 33L37 25H51L56 33Z" fill="#ffffff" opacity=".8"/>
    <circle cx="30" cy="54" r="8" fill="#3a3550"/><circle cx="58" cy="54" r="8" fill="#3a3550"/>
  </g>
  <!-- سبد خرید -->
  <g transform="translate(258 202) scale(.905)">
    <use href="#tile"/>
    <path d="M14 22H22L30 52H62L68 30H25" fill="none" stroke="#ff7043" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 32H66L61 46H32Z" fill="#ff7043" opacity=".35"/>
    <circle cx="34" cy="62" r="5" fill="#ff7043"/><circle cx="58" cy="62" r="5" fill="#ff7043"/>
  </g>
  <!-- پارک -->
  <g transform="translate(164 202) scale(.905)">
    <use href="#tile"/>
    <rect x="38" y="44" width="9" height="24" rx="4" fill="#9a6b4f"/>
    <circle cx="42" cy="34" r="20" fill="#16a34a"/>
    <circle cx="34" cy="28" r="6" fill="#ffffff" opacity=".3"/>
    <path d="M14 68H70" stroke="#9ae6a1" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- خانه -->
  <g transform="translate(70 202) scale(.905)">
    <use href="#tile"/>
    <path d="M42 16L68 38H16Z" fill="#e0409b" stroke="#e0409b" stroke-width="6" stroke-linejoin="round"/>
    <rect x="22" y="38" width="40" height="30" fill="#ff9ccf"/>
    <rect x="36" y="48" width="12" height="20" rx="3" fill="#ffffff"/>
  </g>

  <!-- پیکان‌های کوچک میان کاشی‌ها -->
  <g fill="none" stroke="#e2a33a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M347 241H333M339 235L333 241L339 247"/>
    <path d="M253 241H239M245 235L239 241L245 247"/>
    <path d="M159 241H145M151 235L145 241L151 247"/>
  </g>

  <use href="#spark" transform="translate(150 120) scale(1.1)" fill="#f59e0b"/>
  <use href="#spark" transform="translate(410 110) scale(.8)" fill="#3f6cff"/>
  <use href="#spark" transform="translate(740 330) scale(.9)" fill="#16a34a"/>
</svg>
